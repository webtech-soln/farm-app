name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: farm_app_test
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connect.
        options: >-
          --health-cmd "pg_isready -U farm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://farm:farm@localhost:5432/farm_app_test
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-the-check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build only needs these to be present and well-formed; it never
      # connects, because every route in this app renders on demand.
      DATABASE_URL: postgresql://farm:farm@localhost:5432/farm_app
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-the-check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only what ships. Build tooling advisories are tracked separately —
      # see the note in README.md — and should not block a deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
